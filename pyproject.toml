[tool.ruff]
line-length = 88
target-version = "py313"
# Generated by Alembic; reviewed when written, not restyled afterwards.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # the formatter wraps code; long strings and URLs are left alone
    "UP042",  # (str, Enum) -> StrEnum changes str() of members
]

[tool.ruff.lint.per-file-ignores]
# Alembic's env.py configures logging before importing the models.
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The migrations folder is named alembic too; the import is the library.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# A floor just under the current figure, so coverage can't quietly drop.
fail_under = 65
show_missing = true
skip_covered = true

# Project scripts, the equivalent of package.json "scripts". Run with `task <name>`
# (pip install -r requirements-dev.txt); `task --list` shows them all.

[tool.taskipy.settings]
use_vars = true

[tool.taskipy.variables]
# Every docker task uses both files, so the dev-only services (pgAdmin, Redis
# Commander) are stopped and rebuilt along with the rest.
compose_dev = "docker compose -f docker-compose.yml -f docker-compose.dev.yml"

[tool.taskipy.tasks]
# Runs on your machine against DATABASE_URL and REDIS_URL in .env.
dev = "uvicorn app.main:app --reload --timeout-graceful-shutdown 2"

"docker:dev" = "{compose_dev} up --build"
"docker:dev:no-build" = "{compose_dev} up"
"docker:down" = "{compose_dev} down"
"docker:down:volumes" = "{compose_dev} down --volumes"
"docker:build" = "{compose_dev} build"
"docker:build:no-cache" = "{compose_dev} build --no-cache"
"docker:restart" = "{compose_dev} restart"
"docker:logs" = "{compose_dev} logs -f app"

# Run inside the `migrate` container against the compose database. alembic/ is
# bind-mounted, so a generated revision lands in your working tree.
# task db:revision "add idempotency keys"
"db:revision" = "{compose_dev} run --rm migrate alembic revision --autogenerate -m"
"db:deploy" = "{compose_dev} run --rm migrate alembic upgrade head"
"db:downgrade" = "{compose_dev} run --rm migrate alembic downgrade -1"
"db:psql" = "{compose_dev} exec postgres psql"
