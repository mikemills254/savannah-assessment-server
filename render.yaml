# Render Blueprint: the API, its Postgres and its Redis, in one region.
# Create it from the Render dashboard (New > Blueprint) and point it at this
# repo. Deploys then come from the GitHub pipeline after CI passes, through
# the service's deploy hook, so auto-deploy on push is off.
services:
  - type: web
    name: clinic-api
    runtime: docker
    # Pre-deploy commands need a paid instance. On the free plan, remove
    # preDeployCommand and set MIGRATE_ON_START=true instead (see Dockerfile).
    plan: starter
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    # Traffic moves to a new instance only once this passes, so a broken
    # deploy leaves the previous version serving.
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clinic-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Prompted for when the Blueprint is created; never committed.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: clinic-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    # Reachable only from services in this Render account.
    ipAllowList: []

databases:
  - name: clinic-db
    # Free databases expire after 30 days; use a paid plan for anything kept.
    plan: free
    region: frankfurt
    databaseName: clinic
    user: clinic
    postgresMajorVersion: "17"
    ipAllowList: []
